# SonarQube Cloud analysis, run by the `sonar` job of .github/workflows/validate.yml.
# The organization and project keys must match the project imported at sonarcloud.io.
sonar.organization=ifdevtecnologia
sonar.projectKey=ifdevtecnologia_ifdev-agent-team

# Hand-written code only: dist/ is generated from core/ and targets/, and the Markdown content
# in core/ and docs/ is checked by scripts/validate.sh.
sonar.sources=scripts,targets
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# The scripts support Python 3.9+; CI runs the tests on 3.12.
sonar.python.version=3.9, 3.10, 3.11, 3.12
# Written by `coverage xml -o coverage.xml` with relative paths (.coveragerc).
sonar.python.coverage.reportPaths=coverage.xml
# Shell scripts are tested through subprocesses, which produce no coverage report.
sonar.coverage.exclusions=**/*.sh
