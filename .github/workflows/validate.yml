name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: Ruff
        run: ruff check scripts tests

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the golden and upgrade tests compare with a pre-0004 commit.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Bash syntax
        run: |
          for script in scripts/*.sh scripts/lib/*.sh; do
            bash -n "$script"
          done

      - name: Static validation
        run: bash scripts/validate.sh

      - name: Tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage combine
          coverage report
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  # Separate job so the token never shares a runner with the repository's tests and scripts:
  # it only checks out the sources, downloads the coverage report and runs the scanner.
  sonar:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only whether the secret exists, never its value (a job-level `if` cannot read secrets):
      # fork pull requests and repositories without the secret skip the analysis and stay green.
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - if: env.SONAR_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for new-code detection and blame.
          fetch-depth: 0

      - name: Download coverage report
        if: env.SONAR_ENABLED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-xml

      - name: SonarQube Cloud analysis
        if: env.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
