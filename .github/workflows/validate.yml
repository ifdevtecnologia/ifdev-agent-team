name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: Ruff
        run: ruff check scripts tests

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only whether the secret exists, never its value: forks, Dependabot and the period before
      # the owner adds the secret skip the SonarQube Cloud step and stay green.
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: the golden and upgrade tests compare with a pre-0004 commit, and
          # SonarQube Cloud uses it for new-code detection and blame.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Bash syntax
        run: |
          for script in scripts/*.sh scripts/lib/*.sh; do
            bash -n "$script"
          done

      - name: Static validation
        run: bash scripts/validate.sh

      - name: Tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage combine
          coverage report
          coverage xml -o coverage.xml

      - name: SonarQube Cloud analysis
        if: env.SONAR_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
