# Opt-in Codex profile for supervised runs: codex --profile ifdev-autonomous
# Managed by ifdev-ai-tools; the base ~/.codex/config.toml is never modified.
# Keeps the workspace sandbox, never pauses for human approval, and lets sandboxed commands
# reach the network (dependencies, git push, gh) for this profile only. Requests that cannot
# run within the sandbox or an existing allow rule fail closed instead of prompting.
approval_policy = "never"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true
